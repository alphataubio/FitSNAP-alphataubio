[project]
name = "slate_solver"
version = "0.1.0"
description = "Cython wrapper for SLATE solver in FitSNAP"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy",
    "mpi4py"
]

[build-system]
requires = ["setuptools>=61.0", "wheel", "Cython>=3.0", "numpy>=2.0", "mpi4py>=4.0"]
build-backend = "setuptools.build_meta"
