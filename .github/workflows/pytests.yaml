name: tests

on:
  pull_request:
    branches: [master]
  push:
    branches: [master]

jobs:
  test-mpi:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
        test: [mpi, quad, pace]
        python-version: ["3.10"]
      max-parallel: 20
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    # ===== macOS environment =====
    
    - name: Load Mac Env
      if: matrix.os == 'macos-latest'
      run: |
        brew update
        brew install openmpi cmake openblas lapack gcc libomp

    - name: Build ADIOS2 (macOS)
      if: matrix.os == 'macos-latest'
      run: |
        git clone --depth=1 https://github.com/ornladios/ADIOS2.git
        cd ADIOS2
        cmake -DADIOS2_USE_MPI=ON \
              -DADIOS2_USE_HDF5=OFF \
              -DCMAKE_BUILD_TYPE=Release \
              -B build
        cmake --build build -j$(sysctl -n hw.logicalcpu)
        sudo cmake --install build

    # ===== Ubuntu environment =====
    
    - name: Load Ubuntu Env
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y cmake g++ gfortran git libopenmpi-dev openmpi-bin \
                                libopenblas-dev liblapack-dev

    - name: Build ADIOS2 (Ubuntu)
      if: matrix.os == 'ubuntu-latest'
      run: |
        git clone --depth=1 https://github.com/ornladios/ADIOS2.git
        cd ADIOS2
        cmake -DADIOS2_USE_MPI=ON \
              -DADIOS2_USE_HDF5=OFF \
              -DCMAKE_BUILD_TYPE=Release \
              -B build
        cmake --build build -j$(nproc)
        sudo cmake --install build

    # ===== Python dependencies =====
    
    - name: Install Python dependencies (with MPI/ADIOS2)
      run: |
        python -m pip install --upgrade pip setuptools wheel
        # CRITICAL FIX: Added Cython here. Required for --no-build-isolation
        python -m pip install numpy Cython pandas scipy psutil tqdm matplotlib tabulate torch sympy pyyaml mpi4py adios2 flake8 pytest

    # ===== pyace installation =====
    
    - name: Install pyace from PR #95
      run: |
        git clone https://github.com/ICAMS/python-ace.git
        cd python-ace
        git fetch origin pull/95/head:pr-95
        git checkout pr-95
        pip install -e .
        cd ..

    # ===== SLATE install =====
    
    - name: Install SLATE library
      run: |
        # Find gfortran - works for both macOS (homebrew) and Ubuntu
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          export FC=$(find /opt/homebrew/bin -name 'gfortran-*' 2>/dev/null | head -n 1)
          if [ -z "$FC" ]; then
            export FC=$(which gfortran 2>/dev/null || echo "")
          fi
          # Extract version and find corresponding g++
          GCC_VERSION=$(basename $FC | sed 's/gfortran-//')
          export CXX=/opt/homebrew/bin/g++-${GCC_VERSION}
          export CC=/opt/homebrew/bin/gcc-${GCC_VERSION}
          echo "Found C compiler: $CC"
          echo "Found C++ compiler: $CXX"
        else
          export FC=$(which gfortran)
          export CXX=$(which g++)
          export CC=$(which gcc)
        fi
        echo "Found Fortran compiler: $FC"
        
        git clone --recursive https://github.com/icl-utk-edu/slate.git
        cd slate
        mkdir build && cd build
        cmake -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_INSTALL_PREFIX=/usr/local \
              -Dbuild_tests=OFF \
              -DCMAKE_C_COMPILER=$CC \
              -DCMAKE_CXX_COMPILER=$CXX \
              -DCMAKE_Fortran_COMPILER=$FC \
              -DCMAKE_CXX_STANDARD=17 ..
        make -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)
        sudo make install
        cd ../..

    - name: Install slate_wrapper
      run: |
        # Set compilers for Python build - same as SLATE build
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          export FC=$(find /opt/homebrew/bin -name 'gfortran-*' 2>/dev/null | head -n 1)
          GCC_VERSION=$(basename $FC | sed 's/gfortran-//')
          export CXX=/opt/homebrew/bin/g++-${GCC_VERSION}
          export CC=/opt/homebrew/bin/gcc-${GCC_VERSION}
          # Also set OpenMP library path for macOS
          export LDFLAGS="-L/opt/homebrew/opt/libomp/lib"
          export CPPFLAGS="-I/opt/homebrew/opt/libomp/include"
        fi
        cd fitsnap3lib/lib/slate_solver
        # CRITICAL FIX: --no-build-isolation so it uses the manually installed mpi4py/Cython
        # This matches the behavior of the Cluster (using pre-installed modules)
        pip install --no-build-isolation .

    # ===== Lint =====
    
    - name: Lint with flake8
      run: |
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics --ignore=F821,F824
        flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

    # ===== Build LAMMPS =====

    - name: Build LAMMPS
      run: |
        which python
        cd ../
        git config --global http.version HTTP/1.1
        git config --global http.postBuffer 157286400

        git clone https://github.com/lammps/lammps.git --branch patch_12Jun2025 --single-branch
        cd lammps/cmake
        mkdir -p build && cd build

        cmake -DLAMMPS_EXCEPTIONS=yes \
          -DBUILD_SHARED_LIBS=yes \
          -DMLIAP_ENABLE_PYTHON=yes \
          -DPKG_PYTHON=yes \
          -DPKG_ML-SNAP=yes \
          -DPKG_ML-PACE=yes \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=10.15 \
          -DPYTHON_EXECUTABLE:FILEPATH=$(which python) ../

        make -j$(nproc 2>/dev/null || sysctl -n hw.logicalcpu)
        sudo make install-python

    # ===== Test Suites =====
    
    - name: Test basic executable examples (MPI)
      run: |
        export PYTHONPATH=$(pwd):$PYTHONPATH
        # Set library path for ADIOS2 on macOS
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          export DYLD_LIBRARY_PATH=/usr/local/lib:$DYLD_LIBRARY_PATH
        fi
        cd tests
        mpirun --oversubscribe -np 4 pytest -s test_examples.py::test_fitsnap_${{ matrix.test }}

    - name: Test nonlinear models
      run: |
        export PYTHONPATH=$(pwd):$PYTHONPATH
        # Set library path for ADIOS2 on macOS
        if [ "${{ matrix.os }}" = "macos-latest" ]; then
          export DYLD_LIBRARY_PATH=/usr/local/lib:$DYLD_LIBRARY_PATH
        fi
        cd tests
        pytest -s test_pytorch.py::test_fd_single_elem
        pytest -s test_pytorch.py::test_fd_multi_elem
        pytest -s test_pytorch.py::test_fd_ace_single_elem
